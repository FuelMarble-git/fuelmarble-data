name: Update Costco fuel JSON

on:
  schedule:
    # Runs daily at 08:55 UTC (London time in winter; in summer London is UTC+1)
    - cron: "55 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install deps
        run: npm install

      # Retries: the apt step inside --with-deps can fail on a transient runner
      # network/DNS blip (seen 11 Nov 2026), which otherwise fails the whole run.
      - name: Install Playwright browsers
        run: |
          for i in 1 2 3; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "Playwright install failed (attempt $i of 3), retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Run scraper
        run: npm run scrape:costco

      - name: Commit & push if changed
        run: |
          git config user.name "costco-bot"
          git config user.email "costco-bot@users.noreply.github.com"
          git add costco_fuel.json
          git diff --cached --quiet || (git commit -m "Update Costco fuel prices" && git push)
